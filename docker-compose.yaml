services:
  app:
    image: ghcr.io/locmaymo/tim:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: app
    restart: unless-stopped
    volumes:
      - app_code:/var/www/html
      - ./.env:/var/www/html/.env
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      - mysql
      - redis
    networks:
      - tim

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
    volumes:
      - dbdata:/var/lib/mysql
      - ./laravel.sql:/docker-entrypoint-initdb.d/laravel.sql
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "3306:3306"
    networks:
      - tim

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - app_code:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/ssl:/etc/ssl
    depends_on:
      - app
    networks:
      - tim

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - tim

volumes:
  dbdata:
  app_code:

networks:
  tim:
    driver: bridge
